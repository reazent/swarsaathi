# Render Blueprint — SwarSaathi API (Sargam + pitch services)
# Dashboard: New → Blueprint → connect this repo → apply.
# Set secret env vars in the Render dashboard (do not commit secrets).

services:
  - type: web
    name: swarsaathi-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PRODUCT_NAME
        value: Sargam
      - key: SARGAM_PUBLIC_URL
        value: https://swarsaathi.com/sargam/
      - key: FAL_MODEL_ID
        value: fal-ai/stable-audio-3/medium/text-to-audio
      - key: STABILITY_MODEL_ID
        value: stabilityai/stable-audio-3-medium
      - key: RUNWARE_ACE_MODEL_ID
        value: runware:ace-step@v1.5-turbo
      - key: WAVESPEED_ACE_MODEL_ID
        value: wavespeed-ai/ace-step-1.5
      - key: FAL_ACE_MODEL_ID
        value: fal-ai/ace-step
      - key: FAL_ACE_PROMPT_MODEL_ID
        value: fal-ai/ace-step/prompt-to-audio
      - key: ACE_STEP_MODEL_REF
        value: ACE-Step/Ace-Step1.5
      - key: SARGAM_SONG_PROVIDER
        value: auto
      # Modal song host is already deployed as app `sargam-ace-step`.
      # Render needs MODAL_TOKEN_ID + MODAL_TOKEN_SECRET (+ audio URL below).
      - key: SARGAM_FREE_CREDITS
        value: "3"
      - key: SARGAM_SECONDS_PER_CREDIT
        value: "30"
      - key: SARGAM_MAX_DURATION_SEC
        value: "180"
      - key: SARGAM_SONG_MAX_DURATION_SEC
        value: "240"
      - key: CORS_ORIGINS
        value: https://swarsaathi.com,https://www.swarsaathi.com,http://localhost:8000,http://127.0.0.1:8000
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      # Secrets — add in Render dashboard (Environment):
      # DATABASE_URL,
      # MODAL_TOKEN_ID, MODAL_TOKEN_SECRET, MODAL_ACE_GENERATE_URL (preferred songs),
      # RUNWARE_API_KEY / WAVESPEED_API_KEY (optional song fallbacks),
      # FAL_KEY (music sketches + last-resort song),
      # SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY,
      # STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET,
      # SENTRY_DSN, POSTHOG_KEY, RESEND_API_KEY, RESEND_FROM,
      # REVENUECAT_PUBLIC_KEY, REVENUECAT_PUBLIC_KEY_IOS, REVENUECAT_SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: MODAL_ACE_AUDIO_URL
        value: https://sumitv77--sargam-ace-audio.modal.run
      - key: RUNWARE_API_KEY
        sync: false
      - key: WAVESPEED_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: SARGAM_UNLIMITED_EMAILS
        sync: false
      - key: SARGAM_ADMIN_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
